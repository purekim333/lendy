name: lendy
services:
  gateway:
    build:
      context: ../deploy/gateway
      dockerfile: Dockerfile
    depends_on: [frontend, backend]
    ports:
      - "80:80"
    restart: always
    networks: [appnet]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    expose: ["8080"]
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE}
      - PORTONE_API_KEY=${PORTONE_API_KEY:-}
      - PORTONE_API_SECRET=${PORTONE_API_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [appnet]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: always
    expose: ["80"]
    networks: [appnet]

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command: [
      "mysqld",
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--max_connections=300"
    ]
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
